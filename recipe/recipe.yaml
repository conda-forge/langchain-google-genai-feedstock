schema_version: 1

context:
  name: langchain-google-genai
  version: 4.4.3

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/langchain_google_genai-${{ version }}.tar.gz
  sha256: 171ca3a9a7707359def977004b99a84a963193e70e8b2c420ad2109e02ddc8ae

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - langchain-core >=1.7.5,<2.0.0
    - google-genai >=2.20.0
    - pydantic >=2.0.0
    - filetype >=1.2.0
tests:
  - python:
      imports:
        - langchain_google_genai
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: An integration package connecting Google's genai package and LangChain
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/langchain-ai/langchain-google

extra:
  recipe-maintainers:
    - jan-janssen
