schema_version: 1

context:
  name: langchain-google-genai
  version: 4.5.2

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/langchain_google_genai-${{ version }}.tar.gz
  sha256: e098d1d52fe6107e7230316da1cf2caed55a52344c4f5351ade6a8b08de5d190

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - langchain-core >=1.8.4,<2.0.0
    - google-genai >=3.3.0
    - pydantic >=2.0.0
    - filetype >=1.2.0
tests:
  - python:
      imports:
        - langchain_google_genai
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: An integration package connecting Google's genai package and LangChain
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/langchain-ai/langchain-google

extra:
  recipe-maintainers:
    - jan-janssen
